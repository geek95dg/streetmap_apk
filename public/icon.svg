<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Map Card Sheet Shape -->
  <g filter="url(#shadow)">
    <rect x="76" y="96" width="360" height="240" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Card header line -->
    <rect x="96" y="116" width="180" height="12" rx="6" fill="#64748b"/>
    <rect x="96" y="136" width="110" height="8" rx="4" fill="#94a3b8"/>
    <!-- Territory Number Badge -->
    <rect x="360" y="112" width="56" height="32" rx="8" fill="#1e3a8a"/>
    <text x="388" y="134" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">12</text>
    <!-- Map area on card -->
    <rect x="96" y="160" width="320" height="152" rx="10" fill="#e2e8f0"/>
    <path d="M 120 280 L 190 200 L 260 250 L 330 180 L 400 230" fill="none" stroke="#94a3b8" stroke-width="6" stroke-dasharray="8 6"/>
    <circle cx="260" cy="250" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="4"/>
  </g>

  <!-- Mobile phone / Location marker indicator -->
  <g filter="url(#shadow)">
    <circle cx="380" cy="380" r="64" fill="url(#accent)"/>
    <!-- Pin icon inside circle -->
    <path d="M 380 342 C 362 342 348 356 348 374 C 348 398 380 422 380 422 C 380 422 412 398 412 374 C 412 356 398 342 380 342 Z" fill="#ffffff"/>
    <circle cx="380" cy="372" r="7" fill="#0284c7"/>
  </g>

  <!-- S-13 check icon bottom left -->
  <g filter="url(#shadow)">
    <circle cx="132" cy="380" r="48" fill="#10b981"/>
    <path d="M 116 380 L 128 392 L 148 368" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
